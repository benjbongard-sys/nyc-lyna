name: Validate full NOUX itinerary services before merge
on:
  push:
    branches:
      - fix/complete-route-enrichment-tickets-20261122
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new route and booking modules
        run: |
          node --check booking-desk.js
          node --check route-guide.js
          node --check trip-revision.js
          node --check food-wishlist.js
          node --check trip-settings-tools.js
          node scripts/test_final_services.js
      - name: Verify site integration and previously working features
        run: |
          node scripts/test_trip_revision.js
          node scripts/test_direct_plan.js
          node scripts/test_trip_settings_tools.js
          node scripts/test_food_wishlist.js
          node scripts/test_food_guide.js
          node scripts/test_ui_slim.js
          node scripts/test_sync_core.js
          node scripts/test_sync_client.js
          node scripts/test_offline_worker.js
          node scripts/test_unlock_recovery.js
      - name: Validate security-check syntax
        run: python -m py_compile scripts/check_public.py
