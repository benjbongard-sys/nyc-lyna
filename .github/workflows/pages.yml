name: Publish encrypted NOUX planner with verified photography
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle React dependencies without storing private itinerary source
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          mkdir -p lib
          cp node_modules/react/umd/react.production.min.js lib/react.min.js
          cp node_modules/react-dom/umd/react-dom.production.min.js lib/react-dom.min.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.js lib/maplibre-gl.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.css lib/maplibre-gl.css
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: pip install Pillow==11.3.0
      - name: Fetch and validate original venue photography
        run: python scripts/fetch_photos.py
      - name: Verify MTA Worker health (diagnostic only)
        continue-on-error: true
        run: |
          echo 'Testing deployed MTA proxy /health endpoint'
          curl -sS --location --max-time 25 -w '\nHTTP %{http_code}\n' 'https://noux-mta-live.benjbongard.workers.dev/health'
      - name: Compile official MTA subway schedules for each NYC visit day
        run: python scripts/build_mta_timetable.py
      - name: Validate routing data and train-prediction parser
        run: |
          node scripts/test_routeplanner.js
          node scripts/test_gtfsrt.js
          node scripts/test_explorer.js
          node scripts/test_food_wishlist.js
          node scripts/test_food_guide.js
          node scripts/test_decision_guide.js
          node scripts/test_trip_settings_tools.js
          node scripts/test_ui_slim.js
          node scripts/test_trip_revision.js
          node scripts/test_direct_plan.js
          node scripts/test_final_services.js
          node scripts/test_integrity_audit.js
          node scripts/test_map_filter.js
          node scripts/test_explorer_mobile.js
          node scripts/test_offline_worker.js
          node scripts/test_venues.js
          node scripts/test_choices.js
          node scripts/test_day_audit.js
          node scripts/test_unlock_recovery.js
          node scripts/test_departure.js
          node scripts/test_sync_core.js
          node scripts/test_sync_client.js
          node scripts/test_sync_worker.mjs
          node scripts/test_subway_map.js
          python - <<'PY_CHECK'
          import json,pathlib
          p=pathlib.Path('assets/subway')
          n=json.loads((p/'network.json').read_text())
          assert len(n['stations'])>=400 and len(n['transfers'])>50
          for d in range(23,28):
            f=p/f'2026-11-{d:02d}.json'
            z=p/(f.name+'.gz')
            x=json.loads(f.read_text())
            assert len(x['connections'])>100000 and z.stat().st_size>50000
            print(f.name,len(x['trips']),len(x['connections']),'gzip',z.stat().st_size)
          PY_CHECK
      - name: Construct publication package with encrypted itinerary ONLY
        env:
          MTA_PROXY_URL: ${{ vars.MTA_PROXY_URL || 'https://noux-mta-live.benjbongard.workers.dev' }}
        run: |
          mkdir -p _site
          cp index.html sw.js unlock.js trip-revision.js approved-week.js booking-desk.js route-guide.js map-filter.js food-wishlist.js food-guide.js decision-guide.js trip-settings-tools.js explorer.js venues.js choice-orchestrator.js day-audit.js departure-kit.js sync-core.js sync.js subway-map.js styles.css manifest.webmanifest robots.txt .nojekyll _site/
          cp -a lib assets _site/
          node -e 'require("fs").writeFileSync("_site/worker-config.js", "window.NYC_MTA_PROXY_URL = " + JSON.stringify(process.env.MTA_PROXY_URL || "") + ";\n")'
          python scripts/check_public.py
          echo 'Encrypted website assets:'
          find _site -maxdepth 2 -type f | sort | head -70
      - name: Save independent fully illustrated offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: noux-private-nyc-site
          path: _site
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact to become available
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4