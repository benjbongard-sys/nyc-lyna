name: Validate encrypted approved itinerary (pre-merge)
on:
  push:
    branches:
      - feature/secure-final-itinerary-import-20261122
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved plan and cross-device compatibility
        run: |
          node --check trip-revision.js
          node --check trip-settings-tools.js
          node --check unlock.js
          node scripts/test_trip_revision.js
          node scripts/test_sync_core.js
          node scripts/test_trip_settings_tools.js
          node scripts/test_unlock_recovery.js
          node scripts/test_ui_slim.js
          node scripts/test_offline_worker.js
      - name: Verify public deployment security checks compile
        run: python -m py_compile scripts/check_public.py
